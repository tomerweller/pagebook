  if (location.hostname !== 'tomerweller.com') return;
  var s = document.createElement('script');

  s.src = 'https://www.googletagmanager.com/gtag/js?id=G-7VJRGST3G9';
  document.head.appendChild(s);

<body>
<div class="shell">
  <div class="page">
    <header class="top">
      <div class="utility-row">
        <a class="brand" href="explainer/">PAGEBOOK<span class="brand-sub"> · STELLAR TESTNET</span></a>
        <div class="fresh" id="fresh"><span class="pill"></span><span id="fresh-text">loading…</span></div>

      <h1 class="pair-title" id="meta"><span id="pair">-- / --</span><span class="pair-caret">▾</span></h1>

    </header>
    <div class="kpis" id="kpis"></div>
    <section>
      <h2>depth</h2>
      <div class="ladder" id="ladder"></div>
    </section>
    <section>
      <div class="feeds">
        <div>
          <h2>trades</h2>
          <div class="panel"><ol class="tape" id="trades"></ol></div>
          <p class="note" id="history-note"></p>
        </div>
        <div>
          <h2>activity</h2>
          <div class="panel"><ol class="tape activity" id="activity"></ol></div>
        </div>
      </div>
    </section>
    <section>
      <h2>market</h2>
      <dl class="facts" id="facts"></dl>
    </section>
  </div>
  <aside class="wallet" id="wallet"></aside>
