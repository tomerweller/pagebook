<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1013">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F5F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PageBook">
<title>PageBook client · Stellar Testnet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
</head>
<body>
<div class="shell">
  <div class="page">
    <header class="top">
      <div>
        <h1 id="pair">-- / --</h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="fresh" id="fresh"><span class="pill"></span><span id="fresh-text">loading…</span></div>
    </header>
    <div class="kpis" id="kpis"></div>
    <section>
      <h2>depth</h2>
      <div class="ladder" id="ladder"></div>
    </section>
    <section>
      <div class="feeds">
        <div>
          <h2>trades</h2>
          <div class="panel"><ol class="tape" id="trades"></ol></div>
          <p class="note" id="history-note"></p>
        </div>
        <div>
          <h2>activity</h2>
          <div class="panel"><ol class="tape activity" id="activity"></ol></div>
        </div>
      </div>
    </section>
    <section>
      <h2>market</h2>
      <dl class="facts" id="facts"></dl>
    </section>
  </div>
  <aside class="wallet" id="wallet"></aside>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
