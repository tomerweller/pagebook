<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #0E1013; }
  .frame {
    width: 512px;
    height: 512px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0E1013;
  }
  .mark {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transform-origin: center;
  }
  .frame.maskable .mark { transform: scale(0.8); }
  .letters {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-weight: 700;
    font-size: 210px;
    letter-spacing: -0.06em;
    color: #2EBD85;
    line-height: 0.85;
  }
  .bar {
    width: 62%;
    height: 10px;
    margin-top: 22px;
    background: #2EBD85;
    opacity: 0.85;
  }
</style>
</head>
<body>
<div class="frame" id="frame"><div class="mark"><div class="letters">PB</div><div class="bar"></div></div></div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("mask") === "1") document.getElementById("frame").classList.add("maskable");
</script>
</body>
</html>
