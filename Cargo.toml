[workspace]
resolver = "2"
members = [
    "contracts/*",
    "crates/*",
]

[workspace.package]
edition = "2021"
publish = false
version = "0.0.0"

[workspace.dependencies]
soroban-sdk = "27.0.6"
pagebook-types = { path = "crates/pagebook-types" }
pagebook-client = { path = "crates/pagebook-client" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
